name: Feature request
description: Propose something new — a quest, a Path, a platform feature
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What are you proposing
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: What's the gap this fills, or the problem it solves?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / what "done" looks like
      description: Rough — doesn't need to be a full spec.
    validations:
      required: false

  - type: checkboxes
    id: phase-check
    attributes:
      label: Before submitting
      options:
        - label: I checked docs/MASTER_PLAN.md and docs/TODO.md — this isn't already tracked there
          required: true
