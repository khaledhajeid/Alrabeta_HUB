name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Server modules (db.ts, queue.ts, auth.ts) connect to Postgres/Redis at
    # module scope, not lazily inside a request handler — `next build` loads
    # that module graph even though nothing queries at build time (every
    # route is dynamic, nothing statically generates against the DB). Real
    # service containers here avoid gambling on whether an unhandled
    # connection-error event from an unreachable host crashes the build.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alrabeta
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: alrabeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alrabeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/web

    env:
      DATABASE_URL: postgres://alrabeta:localdev@localhost:5432/alrabeta
      REDIS_URL: redis://localhost:6379
      FORGEJO_URL: http://localhost:3300
      FORGEJO_WEBHOOK_SECRET: ci-placeholder-secret
      FORGEJO_API_TOKEN: ci-placeholder-token
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-real-use
      BETTER_AUTH_URL: http://127.0.0.1:3000
      FORGEJO_OAUTH_CLIENT_ID: ci-placeholder-client-id
      FORGEJO_OAUTH_CLIENT_SECRET: ci-placeholder-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # tsc alone doesn't know about LayoutProps/PageProps — those come from
      # .next/types, generated by Next.js itself (next dev/build normally
      # do this as a side effect, which is why this only shows up on a
      # fresh checkout that's never run either locally).
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  commitlint:
    # PR-only: needs a base/head range to lint, and a local commit-msg hook
    # already covers the push-to-main case for anyone who didn't bypass it.
    # This exists specifically because --no-verify (or any tool that skips
    # git hooks) makes the local hook alone not actually enforce anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
