# Egress gateway for the dockerfile-check build container. This is the
# real containment boundary — not an HTTP_PROXY env var Kaniko is trusted
# to respect, but the *only* route off the internal Docker network the
# build container sits on (see poc-test.sh: the build container attaches
# to an --internal network with no WAN route; this proxy is the one
# container bridging it to the outside world). A RUN step that ignores
# proxy env vars entirely and tries to open a raw socket still has nowhere
# to send the packets — there is no other path out.
#
# CONNECT (used for all HTTPS registry traffic) exposes the target
# hostname in plaintext before TLS starts, so this allowlists by that
# hostname without needing to terminate/inspect TLS itself (no ssl_bump,
# no MITM cert to trust inside the build container).
http_port 3128

# production.cloudfront.docker.com is Docker Hub's actual blob-storage CDN
# host (AWS CloudFront) — verified empirically against a real pull, not
# assumed from memory: an earlier guess of "cloudflare.docker.com" was
# wrong and squid's own 403 (not a connection failure) proved the deny
# path works correctly while catching that the allow list itself was
# incomplete.
# Registry hosts alone aren't enough: a realistic Dockerfile-authoring
# quest will `apt-get install` something, and that traffic goes to the
# distro's package mirror, not a container registry. deb.debian.org /
# security.debian.org are added because every other runner image in this
# project standardizes on debian:bookworm-slim (infra/sandbox,
# infra/sandbox-git-assert, infra/sandbox-io-match) — same curated,
# well-known-infra reasoning as the registry hosts below, still a fixed
# allowlist, not open internet. Alpine/Ubuntu mirrors would be the same
# mechanism if a future quest needs them; not added here since nothing in
# this project uses those bases yet.
acl allowed_registries dstdomain \
    .docker.io \
    production.cloudfront.docker.com \
    ghcr.io \
    .githubusercontent.com \
    deb.debian.org \
    security.debian.org

acl CONNECT method CONNECT
acl SSL_ports port 443

# Deny CONNECT to anything other than port 443 on an allowed registry —
# closes off using CONNECT as a generic TCP tunnel to some other port.
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_registries
http_access deny CONNECT

# Plain HTTP (e.g. the initial docker.io redirect) — same allowlist.
http_access allow allowed_registries
http_access deny all

# Standard hardening: don't let the build container reach the proxy host's
# own loopback-adjacent services, don't leak internal details in headers.
http_access deny to_localhost
via off
forwarded_for delete

coredump_dir /var/spool/squid
