name: alrabeta-hub-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alrabeta
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: alrabeta
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-forgejo-db.sh:/docker-entrypoint-initdb.d/init-forgejo-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alrabeta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: alrabeta
      FORGEJO__database__PASSWD: localdev
      # Public domain via Cloudflare Tunnel — this is what Forgejo bakes into
      # every URL it generates (repository.html_url, commit.url in webhook
      # payloads, OAuth pages, etc.), so it has to match what beta users
      # actually hit or every "Open in Forgejo" link the Hub shows is wrong.
      FORGEJO__server__DOMAIN: git.alrabetahub.app
      FORGEJO__server__ROOT_URL: https://git.alrabetahub.app/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_DOMAIN: git.alrabetahub.app
      # This image runs a full system OpenSSH daemon in parallel (s6 "openssh"
      # service, always on, unconditional) — Forgejo's own built-in Go SSH
      # server must stay off or both fight over the container's :22.
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
      # Skip the interactive install wizard — the instance boots pre-configured.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?set in infra/.env, see .env.example}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN:?set in infra/.env, see .env.example}
      FORGEJO__oauth2__JWT_SECRET: ${FORGEJO_JWT_SECRET:?set in infra/.env, see .env.example}
      # Private club, not a public forge — no self-serve signup, no browsing without an account.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
    ports:
      - "3300:3000"
      - "2222:22"
    volumes:
      - forgejo_data:/data

  # The one route off dockerfile-check-internal, which is deliberately
  # provisioned with no WAN route of its own (see
  # infra/sandbox-dockerfile-check/README.md). Every dockerfile-check job
  # attaches only to that internal network, so this proxy is the sole path
  # a build's RUN steps (or Kaniko's own registry pulls) have to the real
  # internet, and squid.conf allowlists exactly the registry and package
  # mirror hosts the runner needs, denying everything else.
  dockerfile-check-proxy:
    build:
      context: ./sandbox-dockerfile-check/proxy
    container_name: dockerfile-check-proxy
    restart: unless-stopped
    networks:
      - default
      - dockerfile-check-internal

volumes:
  pgdata:
  redisdata:
  forgejo_data:

networks:
  dockerfile-check-internal:
    internal: true
    name: dockerfile-check-internal
